name: Deploy Conduit Application

on:
  workflow_run:
    workflows: ["Build and push Docker images"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature-deployment' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/***/conduit-container
            git fetch origin
            git checkout -B feature-deployment origin/feature-deployment
            git pull origin feature-deployment
            docker compose pull
            docker compose down
            docker compose up -d
