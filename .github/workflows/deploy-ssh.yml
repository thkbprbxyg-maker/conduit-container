name: Deploy to remote server via SSH

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add remote host to known_hosts (optional)
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts || true

      - name: Pull images and restart compose on remote
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            docker login ghcr.io -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_TOKEN }} &&
            docker pull ghcr.io/${{ github.repository_owner }}/conduit-backend:latest &&
            docker pull ghcr.io/${{ github.repository_owner }}/conduit-frontend:latest &&
            cd /path/to/your/deploy && \
            docker compose pull && docker compose up -d --remove-orphans
          '

    # Notes:
    # - You must set repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
    #   REGISTRY_USER and REGISTRY_TOKEN. REGISTRY_TOKEN can be a PAT with read:packages
    #   permission or a Docker registry token. The remote host must have docker & docker-compose installed
    #   and a deploy directory containing a docker-compose.yml that references the GHCR images.
