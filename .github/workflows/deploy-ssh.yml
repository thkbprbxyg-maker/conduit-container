name: Deploy to remote server via SSH

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add remote host to known_hosts (optional)
        run: |
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts || true

      - name: Pull images and restart compose on remote (robust)
        run: |
          # Use a safer remote sequence: fetch/reset to the branch, show docker compose
          # version/config for debugging, then pull and bring services up. Do NOT run
          # `git submodule update` here because the repo is not using submodules.
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -euxo pipefail
            cd /home/${{ secrets.DEPLOY_USER }}/conduit-container || exit 1
            git fetch origin && git reset --hard origin/feature-deployment || true
            echo "=== docker compose version ==="; docker compose version || docker --version || true
            echo "=== docker compose config (validation) ==="; docker compose config || true
            docker login ghcr.io -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_TOKEN }} || true
            docker pull ghcr.io/${{ github.repository_owner }}/conduit-backend:latest || true
            docker pull ghcr.io/${{ github.repository_owner }}/conduit-frontend:latest || true
            docker compose down --remove-orphans || true
            docker compose pull || true
            docker compose up -d --build --remove-orphans || (docker compose config && false)
          '

    # Notes:
    # - You must set repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY,
    #   REGISTRY_USER and REGISTRY_TOKEN. REGISTRY_TOKEN can be a PAT with read:packages
    #   permission or a Docker registry token. The remote host must have docker & docker-compose installed
    #   and a deploy directory containing a docker-compose.yml that references the GHCR images.
