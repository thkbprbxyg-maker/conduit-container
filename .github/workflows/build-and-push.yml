name: Build and push Docker images

on:
  push:
    branches: [ main, master, feature-deployment ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Debug: list workspace and show Dockerfiles
        run: |
          echo 'Repository root:'
          ls -la
          echo '--- backend dir ---'
          ls -la backend || true
          echo '--- frontend dir ---'
          ls -la frontend || true
          echo '--- backend Dockerfile ---'
          sed -n '1,120p' backend/Dockerfile || true
          echo '--- frontend Dockerfile ---'
          sed -n '1,120p' frontend/Dockerfile || true

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          # Use repository root as context and give a repo-relative Dockerfile
          # path. This is reliable across runners: Buildx will receive the
          # repository context and can locate the Dockerfile explicitly.
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conduit-backend:latest
            ghcr.io/${{ github.repository_owner }}/conduit-backend:${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conduit-frontend:latest
            ghcr.io/${{ github.repository_owner }}/conduit-frontend:${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Output image names
        run: |
          echo "backend=ghcr.io/${{ github.repository_owner }}/conduit-backend:latest"
          echo "frontend=ghcr.io/${{ github.repository_owner }}/conduit-frontend:latest"
