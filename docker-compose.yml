services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES-SER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: on-failure

  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    depends_on:
      - backend
    ports:
      - "8282:80"
    restart: on-failure

volumes:
  pgdata: