services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ghcr.io/thkbprbxyg-maker/conduit-backend:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    image: ghcr.io/thkbprbxyg-maker/conduit-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8282:80"

volumes:
  pgdata:
