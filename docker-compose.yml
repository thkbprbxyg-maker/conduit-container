services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./conduit-backend
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ./conduit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8282:80"

volumes:
  pgdata: