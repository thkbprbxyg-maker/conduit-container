services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ghcr.io/thkbprbxyg-maker/conduit-backend:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://conduit:conduit@db:5432/conduit
      ALLOWED_HOSTS: "*"

  frontend:
    image: ghcr.io/thkbprbxyg-maker/conduit-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8282:80"

volumes:
  pgdata: