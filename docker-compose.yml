# docker compose for conduit container 
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: "webapp.env"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./conduit-backend
    restart: unless-stopped
    env_file: "webapp.env"
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
  restart: unless-stopped
    build: ./conduit-frontend
    depends_on:
      - backend
    ports:
      - "8282:80"

volumes:
  pgdata:
